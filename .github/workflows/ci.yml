name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: CLI smoke test on the cached S&P 500 data
        run: btv validate --market spx --candidate trend200_vt15_20 --reps 200
      - name: Quick false-positive check (20 null markets)
        run: btv null --reps 20
